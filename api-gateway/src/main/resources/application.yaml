server:
  port: 8080

spring:

  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth,/api/v1/auth/**

            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/v1/customers,/api/v1/customers/**

            - id: account-service
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/api/v1/accounts,/api/v1/accounts/**

            - id: transaction-service
              uri: lb://TRANSACTION-SERVICE
              predicates:
                - Path=/api/v1/transactions,/api/v1/transactions/**

eureka:

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true

    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway
